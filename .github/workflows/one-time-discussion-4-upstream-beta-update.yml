name: One-time reply to migration Discussion 4

on:
  push:
    branches: [main]

permissions:
  contents: read
  discussions: write

jobs:
  post:
    if: github.event.head_commit.message == 'docs: post upstream beta update to migration discussion [discussion-4-update]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reply to migration report with upstream beta guidance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import subprocess

          repo_owner = "ibasebcast"
          repo_name = "ha-alarmdotcom"
          discussion_number = 4
          target_database_id = 19644413
          message = "### Update (November 16, 2026): You can now test the original integration's beta\n\n@tarekelmohamad, good news! Since this discussion started, I've joined the original `pyalarmdotcom` organization as an owner and brought the maintained integration code back into the **original** repository.\n\nWe have now published **[Alarm.com v2026.11.16b1](https://github.com/pyalarmdotcom/alarmdotcom/releases/tag/v2026.11.16b1)** as an **opt-in beta** of `pyalarmdotcom/alarmdotcom`.\n\n**You no longer need to uninstall the original integration, switch repository ownership to `ibasebcast/ha-alarmdotcom`, or use the Marketplace repair workaround just to try the new upstream code.** Instead, check the existing original Alarm.com listing in Marketplace/HACS for its beta or prerelease version option and choose `v2026.11.16b1` if available.\n\n**Important:** Please make a full Home Assistant backup first, keep your existing Alarm.com configuration entry, and **do not click \"Delete and Uninstall\"** as part of this test. This is a beta, and preserving existing entities, configuration, and automations during a v3-to-v4 upgrade is exactly what we need volunteers to verify. If the beta isn't offered through your installation UI, please tell us what it shows rather than forcing a removal.\n\nWe'd really appreciate your results in the original project's **[beta feedback issue #567](https://github.com/pyalarmdotcom/alarmdotcom/issues/567)**, especially whether your existing configuration and entity IDs remain intact.\n\nFor people who already switched successfully to the maintained `ibasebcast/ha-alarmdotcom` version: **no need to switch back**. That distribution will continue to be supported during the transition.\n\nThanks for helping test this, and sorry for the earlier migration headache!"
          marker = "Update (November 16, 2026): You can now test the original integration's beta"

          def graphql(query, variables, numeric=()):
              args = ["gh", "api", "graphql", "-f", f"query={query}"]
              for k, v in variables.items():
                  args.extend(["-F" if k in numeric else "-f", f"{k}={v}"])
              return json.loads(subprocess.check_output(args, text=True))

          query = """query($owner:String!,$name:String!,$number:Int!) {
            repository(owner:$owner,name:$name) {
              discussion(number:$number) {
                id
                comments(first:100) {
                  pageInfo { hasNextPage }
                  nodes {
                    id
                    databaseId
                    author { login }
                    body
                    replies(first:100) {
                      pageInfo { hasNextPage }
                      nodes { id databaseId author { login } body }
                    }
                  }
                }
              }
            }
          }"""
          response = graphql(query, {
              "owner": repo_owner,
              "name": repo_name,
              "number": discussion_number,
          }, numeric=("number",))
          discussion = response["data"]["repository"]["discussion"]
          if not discussion:
              raise SystemExit("Expected discussion #4 missing; refusing to post")
          root = discussion["comments"]
          if root["pageInfo"]["hasNextPage"]:
              raise SystemExit("More than 100 discussion comments; refusing to guess")
          matches = []
          all_messages = []
          for node in root["nodes"]:
              all_messages.append(node)
              if node["replies"]["pageInfo"]["hasNextPage"]:
                  raise SystemExit("More than 100 replies; refusing to guess")
              all_messages.extend(node["replies"]["nodes"])
              if node["databaseId"] == target_database_id:
                  matches.append(node)
              matches.extend(
                  x for x in node["replies"]["nodes"]
                  if x["databaseId"] == target_database_id
              )
          if any(marker in c["body"] for c in all_messages):
              print("Update already exists, no duplicate comment.")
              raise SystemExit(0)
          if len(matches) != 1:
              raise SystemExit(f"Target comment ID {target_database_id} not found uniquely; refusing to post")
          target = matches[0]
          if target["author"]["login"] != "tarekelmohamad" or "Marketplace" not in target["body"]:
              raise SystemExit("Target comment did not match the reported migration problem")

          mutation = """mutation($discussionId:ID!,$replyToId:ID!,$body:String!) {
            addDiscussionComment(input:{
              discussionId:$discussionId, replyToId:$replyToId, body:$body
            }) { comment { id url } }
          }"""
          result = graphql(mutation, {
              "discussionId": discussion["id"],
              "replyToId": target["id"],
              "body": message,
          })
          created = result["data"]["addDiscussionComment"]["comment"]
          print("Posted discussion reply:", created["url"])
          PY
