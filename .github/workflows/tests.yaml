name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v3
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        pip install -r requirements-dev.txt
        pip install beautifulsoup4 mashumaro phonenumbers pyhumps typer click rich
    - name: Run tests
      run: pytest tests/ -v

  november-compatibility:
    strategy:
      matrix:
        core: ["2026.11.0b0", "2026.11.0b1"]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v3
      with:
        python-version: "3.14"
    - name: Install November beta and compatibility-test dependencies
      run: >-
        pip install "homeassistant==${{ matrix.core }}" "pytest==9.0.3"
        "PyTurboJPEG==2.6.1" beautifulsoup4 mashumaro phonenumbers pyhumps typer click rich
    - name: Test actual November core APIs without the October-only test helper
      env:
        PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      run: >-
        python -c 'import homeassistant; import pytest;
        raise SystemExit(pytest.main(["--noconftest", "-c", "/dev/null",
        "tests/test_core_compatibility.py", "-v",
        "-W", "error::DeprecationWarning:custom_components"]))'
