name: Beta release

on:
  push:
    branches: [beta/2026.10.30]

permissions:
  contents: read

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install beautifulsoup4 mashumaro phonenumbers pyhumps typer click rich
      - name: Python regression tests
        run: pytest tests/ -q
      - name: Camera card regression tests
        run: node --test tests/test_webrtc_card.cjs
      - name: Repository checks
        uses: pre-commit/action@v3.0.1

  november:
    strategy:
      matrix:
        core: ["2026.11.0b0", "2026.11.0b1"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install November compatibility dependencies
        run: >-
          pip install "homeassistant==${{ matrix.core }}" "pytest==9.0.3"
          "PyTurboJPEG==2.6.1" beautifulsoup4 mashumaro phonenumbers pyhumps typer click rich
      - name: November compatibility checks
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: >-
          python -c 'import homeassistant; import pytest;
          raise SystemExit(pytest.main(["--noconftest", "-c", "/dev/null",
          "tests/test_core_compatibility.py", "-v",
          "-W", "error::DeprecationWarning:custom_components"]))'

  publish:
    needs: [validate, november]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable beta version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python -c 'import json; print(json.load(open("custom_components/alarmdotcom/manifest.json"))["version"])')
          [[ "$version" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}b[0-9]+$ ]]
          # Never edit an existing published beta. A follow-up must use a new version.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "Version v$version already exists. Bump the beta version before publishing."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package integration
        run: |
          cd custom_components
          zip -r ../alarmdotcom.zip alarmdotcom -x '*__pycache__*' '*.pyc'
      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Alarm.com ${{ steps.version.outputs.version }} beta
          prerelease: true
          make_latest: false
          body_path: release-notes/${{ steps.version.outputs.version }}.md
          files: alarmdotcom.zip
